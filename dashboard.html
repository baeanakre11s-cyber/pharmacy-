<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الصيدلية</title>
  <style>
    body { font-family: 'Segoe UI'; background: #f0f4f8; margin: 20px; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 10px; text-align: center; }
    .box { background: white; padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ddd; }
    button { background: #667eea; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h2>مرحبا بـ <span id="pharmacy"></span></h2>
    <button onclick="logout()" style="background:red; float:left;">تسجيل خروج</button>
  </div>

  <div class="box">
    <h3>اضافة دواء جديد</h3>
    <input type="text" id="drugName" placeholder="اسم الدواء">
    <input type="number" id="drugPrice" placeholder="السعر">
    <button onclick="addDrug()">اضافة</button>
  </div>

  <div class="box">
    <h3>المخزون</h3>
    <ul id="drugList"></ul>
  </div>

<script>
  document.getElementById('pharmacy').innerText = localStorage.getItem('pharmacyName');
  function logout(){
    localStorage.clear();
    window.location.href = 'index.html';
  }
  function addDrug(){
    alert('تم اضافة الدواء: ' + document.getElementById('drugName').value);
  }
</script>
</body>
</html>
