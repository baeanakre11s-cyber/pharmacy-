<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الصيدلية</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>تسجيل دخول الصيدلية 🔒</h1>
      <form id="loginForm">
        <input type="text" id="pharmacyName" placeholder="اسم الصيدلية" required>
        <input type="text" id="username" placeholder="اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة السر" required>
        <button type="submit">دخول / انشاء حساب</button>
        <p class="note">اول مرة؟ اكتبي البيانات وراح يحفظ الحساب.</p>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
